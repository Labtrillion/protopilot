[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoro-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5", "pypdf>=5,<8", "pymupdf>=1.26,<2", "qdrant-client>=1.15,<2", "fastembed>=0.7,<1", "numpy>=1.26,<3", "torch>=2.6,<3", "transformers>=4.51,<5", "sentence-transformers>=5,<6", "huggingface-hub>=0.34,<1", "tqdm>=4.66,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

